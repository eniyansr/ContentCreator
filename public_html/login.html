<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – CreatorAI</title>
    <meta name="description" content="Log in to your CreatorAI account to access your personalized AI content creation tools.">
    <meta name="base-url" content="/">
    <link rel="stylesheet" href="/assets/css/global.css">
    <link rel="stylesheet" href="/assets/css/auth.css">
    <link rel="stylesheet" href="/assets/css/responsive.css">
    <style>
        .auth-alert-error {
            background-color: #fee2e2;
            color: #b91c1c;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="auth-page">
        <div class="auth-container">
            <div class="auth-card">
                <div class="auth-header">
                    <a href="/" class="auth-logo">
                        <div class="auth-logo-icon">✦</div>
                        CreatorAI
                    </a>
                    <h1 class="auth-title">Welcome Back</h1>
                    <p class="auth-subtitle">Sign in to your creator account</p>
                </div>

                <div id="authAlert" class="auth-alert d-none"></div>

                <form id="loginForm" class="auth-form" novalidate>
                    <div class="form-group">
                        <label class="form-label" for="email">Email or Username <span class="required">*</span></label>
                        <input type="text" id="email" name="email" class="form-input" placeholder="Enter your email or username" required autocomplete="username">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="password">Password <span class="required">*</span></label>
                        <div class="password-field" style="position: relative;">
                            <input type="password" id="password" name="password" class="form-input" placeholder="Enter your password" required autocomplete="current-password">
                            <button type="button" class="password-toggle" onclick="togglePassword('password', this)" aria-label="Toggle password visibility" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer;">👁️</button>
                        </div>
                    </div>

                    <div class="auth-options">
                        <label class="form-check">
                            <input type="checkbox" name="remember" value="1">
                            <span class="form-check-label">Remember me</span>
                        </label>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg" id="loginBtn" style="width: 100%; margin-top: 20px;">
                        Sign In
                    </button>
                </form>

                <div class="auth-footer" style="text-align: center; margin-top: 20px; font-size: 14px;">
                    <p>Don't have an account? <a href="/register.html">Create Account</a></p>
                </div>
            </div>
        </div>
    </div>

    <script src="/assets/js/utils.js"></script>
    <script>
        function togglePassword(fieldId, btn) {
            const field = document.getElementById(fieldId);
            if (field.type === 'password') {
                field.type = 'text';
                btn.textContent = '🙈';
            } else {
                field.type = 'password';
                btn.textContent = '👁️';
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const alert = document.getElementById('authAlert');
            
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await res.json();
                if (data.success) {
                    localStorage.setItem('token', data.token);
                    window.location.href = data.redirect || '/';
                } else {
                    alert.textContent = data.error || 'Login failed';
                    alert.classList.remove('d-none');
                    alert.classList.add('auth-alert-error');
                }
            } catch (err) {
                alert.textContent = 'Network error';
                alert.classList.remove('d-none');
                alert.classList.add('auth-alert-error');
            }
        });
    </script>
</body>
</html>
